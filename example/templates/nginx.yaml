apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    worker_processes  1;
    events {
        worker_connections  1024;
    }
    http {
      log_format debug '$remote_addr - $host - "$request" '
                      'x-cbt-host="$http_x_cbt_host" '
                      'bucket_name="$bucket_name" '
                      'path_bucket="$path_bucket" '
                      'final_bucket="$final_bucket" '
                      'target_backend="$target_backend"';

      access_log /dev/stdout debug;
      error_log  /dev/stdout debug;

      upstream pizza_upstream {
          server pizza.default.svc.cluster.local:80;
      }
      upstream sushi_upstream {
          server sushi.default.svc.cluster.local:80;
      }

      map $http_x_cbt_host $bucket_name {
          default "";
          ~^(?<bucket>[^.]+)\.s3\..*$ $bucket;
      }

      map $request_uri $path_bucket {
          default "";
          ~^/([^/]+)/.*$ $1;
      }

      map $bucket_name $final_bucket {
          default $path_bucket;
          "" $path_bucket;  # If header is empty, use path
          "~." $bucket_name; # If header has a valid bucket, use it
      }

      map $final_bucket $target_backend {
          default "pizza_upstream";
          include /etc/nginx/bucket_map.conf;
      }

      server {
          listen 80;

          location / {
              proxy_pass http://$target_backend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bucket-map
data:
  bucket_map.conf: |
    bucket1      pizza_upstream;
    bucket2      pizza_upstream;
    bucket3      sushi_upstream;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config
      - name: bucket-map-volume
        configMap:
          name: bucket-map
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: bucket-map-volume
          mountPath: /etc/nginx/bucket_map.conf
          subPath: bucket_map.conf
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
